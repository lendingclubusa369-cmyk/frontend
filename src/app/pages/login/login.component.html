<div class="login-page">

    <!-- Header -->
    <header class="login-header">
        <div class="header-container">
            <a class="brand" routerLink="/" aria-label="LendingClub Home">
                <span class="brand-grid">
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                </span>
                <span class="brand-name">
                    Lending<span>Club</span>
                </span>
            </a>
        </div>
    </header>

    <!-- Login Form -->
    <main class="login-main">

        <div class="login-card">

            <div class="login-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.5" stroke-linecap="round"
                     stroke-linejoin="round" width="40" height="40">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
            </div>

            <h1>Admin Login</h1>
            <p class="login-subtitle">
                Sign in to access the submissions dashboard.
            </p>

            @if (errorMessage) {
                <div class="error-banner">
                    <span class="error-icon">!</span>
                    {{ errorMessage }}
                </div>
            }

            <form (ngSubmit)="onSubmit()" class="login-form">

                <div class="form-field">
                    <label for="username">USERNAME</label>
                    <input
                        id="username"
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        [(ngModel)]="username"
                        autocomplete="username"
                        [class.invalid]="errorMessage && !username.trim()"
                    />
                </div>

                <div class="form-field">
                    <label for="password">PASSWORD</label>
                    <div class="password-wrapper">
                        <input
                            id="password"
                            [type]="showPassword ? 'text' : 'password'"
                            name="password"
                            placeholder="Enter password"
                            [(ngModel)]="password"
                            autocomplete="current-password"
                            [class.invalid]="errorMessage && !password.trim()"
                        />
                        <button
                            type="button"
                            class="password-toggle"
                            (click)="togglePassword()"
                            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                        >
                            {{ showPassword ? '🙈' : '👁️' }}
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="login-button"
                    [disabled]="isSubmitting"
                >
                    @if (isSubmitting) {
                        <span class="spinner"></span>
                        Signing in...
                    } @else {
                        Sign In
                    }
                </button>

            </form>

            <div class="login-footer">
                <a routerLink="/">← Back to Home</a>
            </div>

        </div>

    </main>

</div>
